# .github/workflows/email_monitor.yml
name: Email Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  check_emails:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Check for new emails
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
      run: |
        python src/collectors/email_collector.py
    
    - name: Commit questions to database
      run: |
        git config --local user.email "bot@financial-ai.com"
        git config --local user.name "Financial AI Bot"
        git add data/questions_queue.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Add new questions from email"
        git push
